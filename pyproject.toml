[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pli"
dynamic = ["version"]
description = "PLI (Parallel Linked Inference): LLM inference for Apple Silicon Ultra chips (GPU, CPU and Neural Engine), forked from TensorFold 0.6.6"
readme = "README.md"
requires-python = ">=3.11,<3.15"   # MLX 0.32.2 and 0.32.3 publish wheels for Python 3.10 to 3.14
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "LICENSES/*"]
authors = [{ name = "Nicolas F. (nicopingu)" }, { name = "TensorFold contributors" }]
keywords = ["llm", "mlx", "apple-silicon", "neural-engine", "inference", "speculative-decoding", "openai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Apple Silicon (macOS) only. mlx-lm stays below its next minor (the families build on its models).
dependencies = [
  # the prompt kernels and SSD streaming are tested on MLX 0.32.2 and 0.32.3 (#88)
  "mlx>=0.32.2,<0.32.4; sys_platform == 'darwin'",
  "mlx-lm>=0.31.3,<0.33; sys_platform == 'darwin'",
  "numpy>=1.26",
  "huggingface-hub>=0.24",
]

[project.optional-dependencies]
tui = ["rich>=14,<16", "prompt-toolkit>=3.0.51,<4"]
test = ["pytest>=8", "rich>=14,<16", "prompt-toolkit>=3.0.51,<4"]
# --ssd-experts builds a small MLX extension on first use with MLX's own nanobind (MLX 0.32.2 takes 2.15.0)
ssd = ["cmake>=3.27; sys_platform == 'darwin'", "nanobind==3.0.1; sys_platform == 'darwin'"]
vision = ["Pillow>=10", "transformers>=5.3,<6", "mlx-vlm>=0.7.3,<0.8; sys_platform == 'darwin'"]
# response_format, guided_* and structured_outputs on every server: grammar-shaped replies (xgrammar brings torch)
grammar = ["xgrammar>=0.2.8,<0.3"]

[project.urls]
Homepage = "https://github.com/nicopingu/pli"
Source = "https://github.com/nicopingu/pli"
Issues = "https://github.com/nicopingu/pli/issues"

[project.scripts]
pli = "tensorfold.cli:main"
# former name, kept for existing scripts
tensorfold = "tensorfold.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tensorfold.control.assets" = ["*.json"]
"tensorfold.drafters.vendor.z_lab_dflash" = ["README.md"]
"tensorfold.pli" = ["profiles/*/*.env", "extended-list-*.txt"]
"tensorfold.pli.ane" = ["build.sh", "native/*.c", "native/*.mm", "native/*.hpp", "native/*/*.mm", "native/*/*.hpp", "native/LICENSE-splash"]
"tensorfold.families.qwen3_5" = ["*.json"]
"tensorfold.families.nemotron_h" = ["*.txt"]
"tensorfold.families.qwen4_exp" = ["*.txt"]
"tensorfold.streaming.hostsync" = ["*.cpp", "CMakeLists.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/tensorfold/families/deepseek_v4/vendor"]   # third-party code kept unmodified

[tool.setuptools.dynamic]
version = { attr = "tensorfold.__version__" }

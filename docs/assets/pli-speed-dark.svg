<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="PLI speed on an M1 Ultra 64 GB with Qwen3.8-27B 4-bit: writing 111.2, 45.8, 49.2 and 34.1 tokens per second and prompt reading 191, 323, 285 and 213 tokens per second for prompts of 62, 8k, 32k and 96k tokens" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="PLI architecture: one server with an OpenAI and Anthropic API, the 27B with its drafts on GPU and Neural Engine, generation children started on demand, snapshots on disk, background tasks between requests" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>PLI architecture: one server with an OpenAI and Anthropic API, the 27B with its drafts on GPU and Neural Engine, generation children started on demand, snapshots on disk, background tasks between requests</title>
<defs>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="7" stroke="#D9772B" stroke-width="1.6"/></pattern>
<pattern id="hatch2" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="7" stroke="#2F7F86" stroke-width="1.6"/></pattern>
<pattern id="hatchm" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="9" stroke="#5B6683" stroke-width="1.1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6683"/></marker>
</defs>
<rect x="0.5" y="0.5" width="899" height="469" rx="14" fill="#FBFAF6" stroke="#C9CCD6"/>
<text x="36" y="46" font-size="19" font-weight="650" fill="#1C2541" text-anchor="start">How a request flows</text>

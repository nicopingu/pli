<text x="120" y="148" font-size="13" font-weight="500" fill="#1C2541" text-anchor="middle">OpenAI API</text>
<text x="120" y="166" font-size="11.5" font-weight="400" fill="#5B6683" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/v1/...</text>
<rect x="52" y="196" width="136" height="56" rx="10" fill="#FFFFFF" stroke="#C9CCD6" stroke-width="1.3"/>
<text x="120" y="220" font-size="13" font-weight="500" fill="#1C2541" text-anchor="middle">Anthropic API</text>
<text x="120" y="238" font-size="11.5" font-weight="400" fill="#5B6683" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/v1/messages</text>
<rect x="52" y="268" width="136" height="56" rx="10" fill="#FFFFFF" stroke="#C9CCD6" stroke-width="1.3"/>
<text x="120" y="292" font-size="13" font-weight="500" fill="#1C2541" text-anchor="middle">agents, IDEs,</text>
<text x="120" y="310" font-size="11.5" font-weight="400" fill="#5B6683" text-anchor="middle">chat apps</text>
<rect x="52" y="340" width="136" height="56" rx="10" fill="#FFFFFF" stroke="#C9CCD6" stroke-width="1.3"/>
<text x="120" y="364" font-size="13" font-weight="500" fill="#1C2541" text-anchor="middle">voice assistant</text>
<text x="120" y="382" font-size="11.5" font-weight="400" fill="#5B6683" text-anchor="middle">speech in, speech out</text>
<rect x="244" y="78" width="620" height="344" rx="12" fill="none" stroke="#1C2541" stroke-width="2.2"/>
<rect x="260" y="67" width="96" height="22" rx="4" fill="#FBFAF6"/>
<text x="268" y="83" font-size="14" font-weight="700" fill="#1C2541" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">pli serve</text>
<line x1="204" y1="250" x2="240" y2="250" stroke="#5B6683" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="224" y="240" font-size="11" font-weight="500" fill="#5B6683" text-anchor="middle">HTTP</text>
<rect x="264" y="104" width="580" height="44" rx="10" fill="#F1EEE6" stroke="#C9CCD6" stroke-width="1.3"/>
<g transform="translate(278,114) scale(0.9166666666666666)" fill="none" stroke="#D9772B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M6 11l6-6 6 6"/><path d="M5 21h14"/></g>
<text x="310" y="124" font-size="13.5" font-weight="600" fill="#1C2541" text-anchor="start">Scheduler</text>
<text x="310" y="140" font-size="11.5" font-weight="400" fill="#5B6683" text-anchor="start">small requests first, several conversations per round, the LLM before any other model</text>
<rect x="264" y="164" width="284" height="150" rx="10" fill="#FFFFFF" stroke="#C9CCD6" stroke-width="1.3"/>
<rect x="264" y="164" width="284" height="8" rx="4" fill="url(#hatch)"/>
<g transform="translate(278,184) scale(0.9166666666666666)" fill="none" stroke="#D9772B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v10H9l-5 4z"/><path d="M8 9h8M8 12h5"/></g>
<text x="310" y="200" font-size="14" font-weight="650" fill="#1C2541" text-anchor="start">Qwen3.8-27B, 4-bit</text>
<text x="280" y="226" font-size="12" font-weight="400" fill="#1C2541" text-anchor="start">draft: DFlash2 or the MTP head,</text>
<text x="280" y="242" font-size="12" font-weight="400" fill="#1C2541" text-anchor="start">picked per conversation</text>
<text x="280" y="262" font-size="12" font-weight="400" fill="#5B6683" text-anchor="start">same text as without a draft (temp. 0)</text>
<rect x="280" y="270" width="100" height="36" rx="6" fill="#F1EEE6" stroke="#C9CCD6" stroke-width="1.3"/>
<text x="330.0" y="284" font-size="10.5" font-weight="400" fill="#5B6683" text-anchor="middle">writing</text>
<text x="330.0" y="299" font-size="11.5" font-weight="600" fill="#1C2541" text-anchor="middle">GPU</text>
<rect x="388" y="270" width="140" height="36" rx="6" fill="#F1EEE6" stroke="#C9CCD6" stroke-width="1.3"/>
<text x="458.0" y="284" font-size="10.5" font-weight="400" fill="#5B6683" text-anchor="middle">prompt reading</text>
<text x="458.0" y="299" font-size="11.5" font-weight="600" fill="#1C2541" text-anchor="middle">GPU + Neural Engine</text>
<rect x="564" y="164" width="280" height="150" rx="10" fill="#FFFFFF" stroke="#C9CCD6" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="578" y="186" font-size="12.5" font-weight="600" fill="#1C2541" text-anchor="start">Generation children, on demand</text>
<rect x="576" y="200" width="124" height="42" rx="7" fill="#F1EEE6" stroke="#C9CCD6" stroke-width="1.3"/>
<g transform="translate(585,210) scale(0.8333333333333334)" fill="none" stroke="#2F7F86" stroke-width="1.8000000000000003" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 7v10M21 12h0"/></g>
<text x="612" y="226" font-size="12" font-weight="500" fill="#1C2541" text-anchor="start">Voice</text>
<rect x="708" y="200" width="124" height="42" rx="7" fill="#F1EEE6" stroke="#C9CCD6" stroke-width="1.3"/>
<g transform="translate(717,210) scale(0.8333333333333334)" fill="none" stroke="#2F7F86" stroke-width="1.8000000000000003" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></g>
<text x="744" y="226" font-size="12" font-weight="500" fill="#1C2541" text-anchor="start">Transcription</text>
<rect x="576" y="252" width="124" height="42" rx="7" fill="#F1EEE6" stroke="#C9CCD6" stroke-width="1.3"/>
<g transform="translate(585,262) scale(0.8333333333333334)" fill="none" stroke="#2F7F86" stroke-width="1.8000000000000003" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 17l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.6"/></g>
<text x="612" y="278" font-size="12" font-weight="500" fill="#1C2541" text-anchor="start">Images</text>
<rect x="708" y="252" width="124" height="42" rx="7" fill="#F1EEE6" stroke="#C9CCD6" stroke-width="1.3"/>
<g transform="translate(717,262) scale(0.8333333333333334)" fill="none" stroke="#2F7F86" stroke-width="1.8000000000000003" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></g>
<text x="744" y="278" font-size="12" font-weight="500" fill="#1C2541" text-anchor="start">Video + sound</text>
<text x="578" y="308" font-size="10.5" font-weight="400" fill="#5B6683" text-anchor="start">started when asked, stopped when idle</text>
<rect x="264" y="334" width="284" height="70" rx="10" fill="#FFFFFF" stroke="#C9CCD6" stroke-width="1.3"/>
<g transform="translate(278,348) scale(0.9166666666666666)" fill="none" stroke="#D9772B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
<text x="310" y="364" font-size="13" font-weight="600" fill="#1C2541" text-anchor="start">Conversations on disk</text>
<text x="278" y="388" font-size="11.5" font-weight="400" fill="#5B6683" text-anchor="start">taken up again without being read again</text>
<rect x="564" y="334" width="280" height="70" rx="10" fill="#FFFFFF" stroke="#C9CCD6" stroke-width="1.3"/>
<g transform="translate(578,348) scale(0.9166666666666666)" fill="none" stroke="#D9772B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v16M12 4v16M19 4v16"/><circle cx="5" cy="14" r="2" /><circle cx="12" cy="8" r="2"/><circle cx="19" cy="16" r="2"/></g>
<text x="610" y="364" font-size="13" font-weight="600" fill="#1C2541" text-anchor="start">Background tasks</text>
<text x="578" y="388" font-size="11.5" font-weight="400" fill="#5B6683" text-anchor="start">prune, swap and tune the drafter, idle only</text>
<text x="36" y="452" font-size="12" font-weight="400" fill="#5B6683" text-anchor="start">Memory is counted before a model starts; a request that does not fit gets a 503 instead of slowing the Mac.</text>
</svg>
